<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset PartHound</title></head><body style="font-family:Arial;background:#111214;color:white;padding:28px"><h2>Resetting PartHound…</h2><p id="s">Clearing old app cache and lock state.</p><script>
(async()=>{try{localStorage.removeItem('ph_lock_hash_v42');sessionStorage.clear();if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}document.getElementById('s').textContent='Reset complete. Opening PartHound…';setTimeout(()=>location.replace('./index.html?v=442reset'),700)}catch(e){document.getElementById('s').textContent='Reset complete enough. Opening PartHound…';setTimeout(()=>location.replace('./index.html?v=442reset'),700)}})();
</script></body></html>
